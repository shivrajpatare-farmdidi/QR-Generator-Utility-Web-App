      <div style="max-width: 700px; margin: 2rem auto; padding: 1rem; font-family: system-ui, sans-serif;">
        <h1>QR Batch — Bulk QR Code Generator from CSV</h1>
        <p>QR Batch is a free, browser-based utility that generates multiple high-resolution static QR codes from a CSV file. Upload a spreadsheet with Label and Link columns, generate crisp 1024×1024 pixel QR codes, and download them all as a ZIP archive.</p>
        <h2>How It Works</h2>
        <ol>
          <li>Upload a CSV file with Label and Link columns.</li>
          <li>QR Batch reads each row and validates the URLs.</li>
          <li>A static QR code is generated for each valid link.</li>
          <li>Each QR image is named after its corresponding label.</li>
          <li>Download all QR codes as a single ZIP file.</li>
        </ol>
        <h2>Privacy</h2>
        <p>All processing happens entirely inside your web browser. Your CSV file and generated QR codes are never uploaded to any server.</p>
        <p><strong>JavaScript is required to use QR Batch.</strong> Please enable JavaScript in your browser settings.</p>
